<VirtualHost *:80>
    ServerName site-pusher.cloudservetechcentral.com

    ProxyPreserveHost On
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/(.*) ws://127.0.0.1:8788/$1 [P,L]

    ProxyPass / http://127.0.0.1:8788/
    ProxyPassReverse / http://127.0.0.1:8788/

    ErrorLog ${APACHE_LOG_DIR}/site-pusher-error.log
    CustomLog ${APACHE_LOG_DIR}/site-pusher-access.log combined
</VirtualHost>
